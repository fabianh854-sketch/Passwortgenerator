<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwortgenerator</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
 
 <!-- Config -->
 <div class="container">
     <header>
         <h2>Passwortgenerator</h2>
         <button class="icon-btn" id="themeToggle" title="Design wechseln">
             </button>
     </header>
     
     <div class="result-box">
         <input type="text" id="password" readonly placeholder="...">
         <button class="icon-btn" id="copyBtn" title="Kopieren">
             <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
         </button>
     </div>
 
     <div class="settings">
         <div class="range-wrap">
             <div class="range-label">
                 <span>Länge</span>
                 <span id="lengthVal">16</span>
             </div>
             <input type="range" id="length" min="12" max="32" value="16">
         </div>
         
         <div class="option">
             <label for="uppercase">Großbuchstaben (A-Z)</label>
             <input type="checkbox" id="uppercase" checked>
         </div>
         <div class="option">
             <label for="lowercase">Kleinbuchstaben (a-z)</label>
             <input type="checkbox" id="lowercase" checked>
         </div>
         <div class="option">
             <label for="numbers">Zahlen (0-9)</label>
             <input type="checkbox" id="numbers" checked>
         </div>
         <div class="option">
             <label for="symbols">Sonderzeichen (!@#)</label>
             <input type="checkbox" id="symbols" checked>
         </div>
         <div class="option">
             <label for="ambiguous">
                 Ähnliche ausschließen
                 <span class="sub-text">Kein I, l, 1, O, 0</span>
             </label>
             <input type="checkbox" id="ambiguous">
         </div>
     </div>
 
     <button class="generate-btn">
         <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
         Neu generieren
     </button>
 </div>
 
 <!-- Importiere die Anwendung und Konfiguration -->
 <script type="module">
     // Importiere die Anwendung
import { startApp } from './PasswordGeneratorApp.js';

      // Starte die Anwendung
     document.addEventListener('DOMContentLoaded', async () => {
         try {
             await startApp();
         } catch (error) {
             console.error('Start der Anwendung fehlgeschlagen:', error);
             // Zeige eine einfache Fehlermeldung im UI
             const container = document.querySelector('.container');
             if (container) {
                 container.innerHTML = `
                     <div style="text-align: center; padding: 20px; color: #e74c3c;">
                         <h2>Fehler</h2>
                         <p>Die Anwendung konnte nicht gestartet werden.</p>
                         <p style="font-size: 0.9em; margin-top: 10px;">${error.message}</p>
                     </div>
                 `;
             }
         }
     });
 </script>
 
 </body>
 </html>
